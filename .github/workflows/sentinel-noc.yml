name: SENTINEL NOC
on:
  push:
    paths: ['SENTINEL-NOC/**', '.github/workflows/sentinel-noc.yml']
  pull_request:
    paths: ['SENTINEL-NOC/**', '.github/workflows/sentinel-noc.yml']
defaults:
  run:
    working-directory: SENTINEL-NOC
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: SENTINEL-NOC/backend/requirements-dev.lock
      - run: pip install -r backend/requirements-dev.lock
      - run: python -m ruff check app tests
        working-directory: SENTINEL-NOC/backend
      - run: python -m pytest -q
        working-directory: SENTINEL-NOC/backend
      - run: python -m pytest -q
        working-directory: SENTINEL-NOC/backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sentinel:ci-test-password@localhost:5432/sentinel_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: SENTINEL-NOC/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - run: npm ci
        working-directory: SENTINEL-NOC/frontend
      - run: npm test
        working-directory: SENTINEL-NOC/frontend
      - run: npm run build
        working-directory: SENTINEL-NOC/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: SENTINEL-NOC/frontend
      - run: npm run test:e2e
        working-directory: SENTINEL-NOC/frontend
        env:
          SENTINEL_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: SENTINEL-NOC/frontend/test-results

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/setup_local.py
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: curl --fail http://localhost:8000/ready
      - run: curl --fail http://localhost:8080/
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
